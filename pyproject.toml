[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aden-shipping-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "fastapi-cli>=0.0.15,<1",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "uvicorn>=0.30,<1",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "openai>=1.50,<3",
    "qdrant-client>=1.19,<2",
    "sentence-transformers>=6.2,<7",
    "python-dotenv>=1.2,<2",
    "pypdf>=6,<7",
    "langfuse>=5,<6",
    "tiktoken>=0.8,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "ruff==0.17.4",
    "httpx>=0.27,<1",
    "build>=1,<2",
]
# 공식 평가의 RAGAS Faithfulness. 점수 재현을 위해 정확한 버전으로 고정한다.
eval = [
    "ragas==0.4.3",
    # ragas 0.4.3이 import하는 chat_models.vertexai가 langchain-community 0.4.2에서 제거됨
    "langchain-community==0.4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "shared", "shared.*",
    "app", "app.*",
]
exclude = ["tests", "tests.*", "experimental", "experimental.*"]

[tool.setuptools.package-data]
"app.ingestion" = ["catalogs/*.json"]
"app.generation" = ["prompts/*.txt"]
"app.evaluation" = ["prompts/*.txt"]
"app.evaluation.samples" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["experimental"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
include = ["app", "shared", "experimental"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.fastapi]
entrypoint = "app.api.main:app"
