[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aden-shipping-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "uvicorn>=0.30,<1",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "qdrant-client>=1.19,<2",
    "sentence-transformers>=6.2,<7",
    "python-dotenv>=1.2,<2",
    "langfuse>=5,<6",
    "tiktoken>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
