name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 검사 도구 설치
        run: python -m pip install pytest ruff

      - name: 기본 코드 오류 검사
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: C 모듈 테스트
        run: python -m pytest -q member_Damsebi/tests
