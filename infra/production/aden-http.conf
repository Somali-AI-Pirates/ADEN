# HTTP bootstrap for the existing nginx host. Replaced by aden.conf after TLS.
server {
    listen 80;
    listen [::]:80;
    server_name aden.29232923.xyz;
    access_log /var/log/nginx/aden-access.log;
    error_log /var/log/nginx/aden-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        add_header Retry-After 3600 always;
        return 503 "ADEN deployment is not ready.\n";
    }
}
