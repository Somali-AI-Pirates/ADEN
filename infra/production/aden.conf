# Existing host nginx terminates TLS; the future API binds only 127.0.0.1:18010.
server {
    listen 80;
    listen [::]:80;
    server_name aden.29232923.xyz;
    access_log /var/log/nginx/aden-access.log;
    error_log /var/log/nginx/aden-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://aden.29232923.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aden.29232923.xyz;
    ssl_certificate /etc/letsencrypt/live/aden.29232923.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aden.29232923.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/aden/current/web;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;
    access_log /var/log/nginx/aden-access.log;
    error_log /var/log/nginx/aden-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location ~ ^/api/health/ready(?:/|$) {
        return 404;
    }

    location ~ ^/api/query(?:/stream)?$ {
        limit_req zone=aden_query_rate burst=2 nodelay;
        limit_req_status 429;
        limit_conn aden_client_connections 1;
        limit_conn aden_query_connections 2;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:18010;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
        error_page 502 504 =503 @aden_unavailable;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18010/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
        error_page 502 504 =503 @aden_unavailable;
    }

    location @aden_unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 3600 always;
        return 503 '{"status":"unavailable","detail":"ADEN deployment is not ready."}';
    }

    location = / {
        try_files /index.html @aden_unavailable;
    }
    location = /pdf-assets/pdf.worker.min.mjs {
        types { text/javascript mjs; }
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html @aden_unavailable;
    }
    location ~ /\. {
        deny all;
    }
}
