name: aden-local
services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    restart: unless-stopped
    ports:
      - target: 6333
        published: "6333"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
    name: aden-qdrant-data
